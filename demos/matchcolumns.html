<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduKit Match Columns Demo</title>
</head>
<body>
  <div id="app"></div>

  <script src="../v1/edukit.js"></script>
  <script>
    EduKit.render("#app", {
      component: "matchcolumns",
      theme: "dark",
      data: {
        title: "NEET Biology - Cell Organelles and Functions",
        columnA: ["Mitochondria", "Ribosome", "Nucleus", "Chloroplast"],
        columnB: ["ATP production", "Protein synthesis", "DNA storage", "Photosynthesis"],
        correctMapping: { "0": "0", "1": "1", "2": "2", "3": "3" },
        options: [
          { label: "A-q, B-p, C-r, D-s", mapping: {"0":"1","1":"0","2":"2","3":"3"} },
          { label: "A-p, B-q, C-r, D-s", mapping: {"0":"0","1":"1","2":"2","3":"3"} },
          { label: "A-r, B-q, C-p, D-s", mapping: {"0":"2","1":"1","2":"0","3":"3"} },
          { label: "A-p, B-r, C-q, D-s", mapping: {"0":"0","1":"2","2":"1","3":"3"} }
        ]
      }
    });
  </script>
</body>
</html>
