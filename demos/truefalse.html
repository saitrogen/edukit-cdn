<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduKit True/False Demo</title>
</head>
<body>
  <div id="app"></div>

  <script src="../v1/edukit.js"></script>
  <script>
    EduKit.render("#app", {
      component: "truefalse",
      theme: "light",
      data: {
        title: "Physics - Laws of Motion",
        questions: [
          {
            statement: "Newton's first law states that an object at rest stays at rest unless acted upon by an external force.",
            answer: true
          },
          {
            statement: "Acceleration is directly proportional to mass when force is constant.",
            answer: false
          },
          {
            statement: "For every action, there is an equal and opposite reaction.",
            answer: true
          },
          {
            statement: "Friction always opposes motion.",
            answer: true
          },
          {
            statement: "The SI unit of force is the joule.",
            answer: false
          }
        ]
      }
    });
  </script>
</body>
</html>
