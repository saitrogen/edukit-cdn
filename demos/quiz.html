<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduKit Quiz Demo</title>
</head>
<body>
  <div id="app"></div>

  <script src="../v1/edukit.js"></script>
  <script>
    EduKit.render("#app", {
      component: "quiz",
      theme: "light",
      data: {
        title: "NEET Biology Quiz - Cell Biology",
        negativeMarking: true,
        questions: [
          {
            q: "Which organelle is known as the powerhouse of the cell?",
            options: ["Nucleus", "Mitochondria", "Ribosome", "Golgi apparatus"],
            answer: "Mitochondria"
          },
          {
            q: "What is the primary function of ribosomes?",
            options: ["DNA replication", "Protein synthesis", "Lipid metabolism", "Energy production"],
            answer: "Protein synthesis"
          },
          {
            q: "Which of the following is NOT a component of the cell membrane?",
            options: ["Phospholipids", "Proteins", "Cellulose", "Cholesterol"],
            answer: "Cellulose"
          },
          {
            q: "The site of photosynthesis in plant cells is:",
            options: ["Mitochondria", "Chloroplast", "Nucleus", "Endoplasmic reticulum"],
            answer: "Chloroplast"
          },
          {
            q: "Which cell organelle is involved in detoxification?",
            options: ["Lysosome", "Peroxisome", "Vacuole", "Ribosome"],
            answer: "Peroxisome"
          }
        ]
      }
    });
  </script>
</body>
</html>
