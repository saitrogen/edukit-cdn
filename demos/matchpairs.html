<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduKit Match Pairs Demo</title>
</head>
<body>
  <div id="app"></div>

  <script src="../v1/edukit.js"></script>
  <script>
    EduKit.render("#app", {
      component: "matchpairs",
      theme: "light",
      data: {
        title: "Chemistry - Elements and Symbols",
        pairs: [
          { left: "Sodium", right: "Na" },
          { left: "Potassium", right: "K" },
          { left: "Iron", right: "Fe" },
          { left: "Gold", right: "Au" },
          { left: "Silver", right: "Ag" },
          { left: "Copper", right: "Cu" }
        ]
      }
    });
  </script>
</body>
</html>
